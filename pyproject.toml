[project]
name = "bmsolver"
version = "0.1.0"
description = "Layout solver for Builderment belts, splitters and balancers"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["ortools>=9.8"]

[project.scripts]
bmsolver = "bmsolver.cli:main"

[tool.setuptools]
packages = ["bmsolver"]

[tool.setuptools.package-data]
bmsolver = ["blocks.json"]
