name: decode-tmp
on:
  push:
    branches: ['claude/decode-*']
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd site/tools && python - <<'P'
          import json
          import blueprints as b
          for code in open('../../decode.txt').read().split():
              meta, rows = b.decode(b._post('/readBlp', b._post('/downloadBlp', code.encode())))
              print('JSON', json.dumps({'code': code, 'name': meta.get('name'), 'rows': rows}))
          P
