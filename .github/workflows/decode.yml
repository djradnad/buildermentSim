# Decode a blueprint code into the catalogue's text grid (B/S/I/O + direction, ".." empty), printed in the log and
# the run summary. Lets sessions that can't reach the blueprint service read in-game layouts.
name: decode
on:
  workflow_dispatch:
    inputs:
      code:
        description: blueprint code(s), separated by spaces
        required: true
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode
        env:
          CODES: ${{ inputs.code }}
        run: |
          cd site/tools && python - <<'P' | tee -a "$GITHUB_STEP_SUMMARY"
          import os, re
          import blueprints as b
          ID = {v: k for k, v in b.CODE_ID.items()}
          for code in os.environ['CODES'].split():
              if not re.fullmatch(r'[0-9a-z]{4,12}', code):
                  print('bad code', code); continue
              rows = [r for r in b.download(code) if r[0] in ID]
              if not rows:
                  print(code, ': no belts, splitters or undergrounds'); continue
              x0 = min(r[1] for r in rows); y0 = min(r[2] for r in rows)
              W = max(r[1] for r in rows) - x0 + 1; H = max(r[2] for r in rows) - y0 + 1
              g = [['..'] * W for _ in range(H)]
              for r in rows:
                  g[r[2] - y0][r[1] - x0] = ID[r[0]] + str(r[3])
              print('```'); print('%s %dx%d' % (code, W, H)); print('\n'.join(''.join(l) for l in g)); print('```')
          P
