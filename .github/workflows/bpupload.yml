name: bpupload
on:
  push:
    branches: [claude/project-thread-p5bd66]
    paths: [tools/bpupload/grids.json]
jobs:
  up:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/bpupload/upload.py
